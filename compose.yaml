services:
  backend:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment: &backend-env
      FLASK_CONFIG: production
      SECRET_KEY: ${SECRET_KEY:?Set a random SECRET_KEY of at least 32 characters}
      DATABASE_URI: mysql+pymysql://tablon:${DB_PASSWORD:?Set DB_PASSWORD}@db:3306/tablon?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-2}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      CORS_ALLOWED_ORIGINS: ${SITE_URL:?Set the public HTTPS URL}
      MAIL_SERVER: ${MAIL_SERVER:?Set MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:?Set MAIL_DEFAULT_SENDER}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:?Set ADMIN_NOTIFICATION_EMAIL}
      IMAP_SERVER: ${IMAP_SERVER:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set the existing MinIO endpoint reachable from containers}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-${MINIO_BUCKET_NAME:?Set the existing MinIO bucket name}}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  mail-worker:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["flask", "process-outbox"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tablon
      MARIADB_USER: tablon
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: ["database:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    build: ./deploy/redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  database:
  redis-data:
